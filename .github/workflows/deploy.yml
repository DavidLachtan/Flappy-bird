name: Build and Deploy Flappy Bird

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag

      - name: Build game
        run: |
          python -m pygbag --build --app_name "Flappy Bird" main.py

      - name: Apply responsive fullscreen page styling
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("build/web/index.html")
          html = page.read_text(encoding="utf-8")

          html = html.replace(
              'platform.document.body.style.background = "#7f7f7f"',
              'platform.document.body.style.background = "#69beeb"'
          )

          # This game has no audio, so it must not wait for a browser media gesture.
          start_marker = "    # test/wait user media interaction"
          end_marker = "    # start async top level machinery"
          start = html.find(start_marker)
          end = html.find(end_marker, start)
          if start != -1 and end != -1:
              html = html[:start] + html[end:]
          else:
              raise RuntimeError("Could not remove Pygbag's media-click startup gate")

          html = html.replace("ume_block : 1", "ume_block : 0")

          css = """
          <style id="flappy-mobile-fullscreen">
            html, body {
              width: 100% !important;
              height: 100% !important;
              min-height: 100% !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow: hidden !important;
              background: #69beeb !important;
            }
            body {
              position: fixed !important;
              inset: 0 !important;
              width: 100vw !important;
              height: 100vh !important;
              height: 100dvh !important;
              font-family: Arial, sans-serif;
            }
            canvas.emscripten {
              display: block !important;
              position: fixed !important;
              inset: 0 !important;
              width: 100vw !important;
              height: 100vh !important;
              height: 100dvh !important;
              max-width: 100% !important;
              max-height: 100% !important;
              margin: 0 !important;
              padding: 0 !important;
              border: 0 !important;
              background: #69beeb !important;
              touch-action: none;
            }
            #infobox {
              position: fixed !important;
              left: 50% !important;
              top: 50% !important;
              transform: translate(-50%, -50%) !important;
              background: rgba(20, 30, 40, .88) !important;
              color: #fff !important;
              padding: 12px 24px !important;
              border-radius: 8px;
              z-index: 999999;
            }
          </style>
          """
          if 'id="flappy-mobile-fullscreen"' not in html:
              html = html.replace("</head>", css + "\n</head>")

          page.write_text(html, encoding="utf-8")
          print(f"Applied mobile styling to {page}")
          PY

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
